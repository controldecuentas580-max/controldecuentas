<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <title>Control Central</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e14;--panel:#121722;--panel2:#181f2c;--line:#283244;--text:#edf2fa;--muted:#91a0b5;--blue:#5795f5;--blue2:#2563eb;--green:#36c995;--red:#f07878;--amber:#e8b65c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#0e131c;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:24px}
    .brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-mark{width:36px;height:36px;border-radius:11px;background:#1c3559;color:#8dbbff;display:grid;place-items:center;font-weight:800;font-size:18px}.brand strong{font-size:14px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:11px}
    .nav-label{padding:0 10px;color:#64748b;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.12em}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab7c9;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#1a2638;color:#eaf2ff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;color:#748197;font-size:11px;padding:8px}
    main{min-width:0;padding:30px clamp(18px,4vw,48px) 50px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:28px}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:9px;align-items:center}.page-title{font-size:27px;line-height:1.2;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 23px}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:600}.btn:hover{border-color:#47638d}.btn.primary{background:var(--blue2);border-color:var(--blue2);color:white}.btn.danger{color:#ffaaaa;border-color:#713c48;background:#2a171e}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0 28px}.stat,.card,.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:13px}.stat{padding:18px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:29px;margin-top:6px;letter-spacing:-.04em}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 13px}.section-head h2{font-size:16px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}
    .card{padding:17px;transition:.15s}.card.clickable{cursor:pointer}.card.clickable:hover{border-color:#48658e;transform:translateY(-1px)}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:16px}.muted{color:var(--muted)}.meta{color:var(--muted);font-size:12px;margin-top:5px}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;background:#1d2b40;color:#a9caff}.pill.green{background:#15352e;color:#72e0b9}.pill.red{background:#3a2027;color:#ffaaaa}.pill.amber{background:#382d19;color:#f3cb7b}
    .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.search{flex:1;min-width:180px}.field{width:100%;background:#0d121b;border:1px solid #303b4e;color:var(--text);border-radius:9px;padding:10px 11px;outline:none}.field:focus{border-color:var(--blue)}textarea.field{min-height:80px;resize:vertical}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}th{color:#8190a6;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}td{font-size:13px}tr:last-child td{border-bottom:0}.empty{padding:34px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed #354154;border-radius:13px}.empty strong{display:block;color:var(--text);margin-bottom:5px}
    .back{background:transparent;border:0;color:#8dbbff;padding:0;margin:0 0 15px}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap}.detail-title{display:flex;align-items:center;gap:12px}.detail-icon{width:43px;height:43px;border-radius:12px;background:#1b2d49;display:grid;place-items:center;font-size:20px}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:17px 0}.info-box{background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:10px}.info-box small{display:block;color:var(--muted);margin-bottom:4px}.info-box b{overflow-wrap:anywhere}
    dialog{width:min(560px,calc(100% - 26px));max-height:88vh;overflow:auto;background:#141b27;color:var(--text);border:1px solid #354154;border-radius:15px;padding:0;box-shadow:0 25px 80px #000a}dialog::backdrop{background:#03060bd1;backdrop-filter:blur(3px)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:20px;display:grid;gap:13px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-field label{display:block;color:#aab7c9;font-size:12px;margin-bottom:6px}.help{font-size:11px;color:var(--muted);margin-top:5px}
    #loginView{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:27px}.login-card h1{font-size:22px;margin:0 0 5px}.login-card p{color:var(--muted);margin:0 0 22px}.login-card form{display:grid;gap:13px}.notice{padding:11px 13px;border-radius:9px;background:#1c2b40;color:#b9d4fb;font-size:12px}.error{color:#ffaaaa;font-size:12px;white-space:pre-wrap}.toast{position:fixed;right:20px;bottom:20px;background:#1b2a3d;border:1px solid #395276;color:#eaf2ff;padding:12px 16px;border-radius:10px;z-index:20;max-width:min(420px,calc(100% - 40px));box-shadow:0 10px 35px #0008}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.brand{padding:0 4px}.nav{display:flex;overflow:auto}.nav-label,.side-bottom{display:none}.nav button{white-space:nowrap;padding:8px 10px}.nav .ico{display:none}main{padding:22px 15px 40px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.page-title{font-size:23px}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">C</div><div><strong>CONTROL CENTRAL</strong><small>Panel de organización</small></div></div>
      <div class="nav-label">Navegación</div>
      <nav class="nav">
        <button data-page="dashboard" class="active"><span class="ico">▦</span>Panel principal</button>
        <button data-page="casinos"><span class="ico">▣</span>Casinos</button>
      </nav>
      <div class="side-bottom">Datos centralizados</div>
    </aside>
    <main>
      <div class="topbar"><div class="crumb" id="breadcrumb">Inicio / Panel principal</div><div class="top-actions"><span class="muted">Acceso directo</span></div></div>
      <div id="content"></div>
    </main>
  </div>

  <dialog id="editDialog">
    <form id="editForm">
      <div class="modal-head"><h2 id="dialogTitle">Nuevo registro</h2><button type="button" class="btn small" id="closeDialog">Cerrar</button></div>
      <div class="modal-body" id="dialogFields"></div>
      <div class="modal-foot"><button type="button" class="btn" id="cancelDialog">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
    </form>
  </dialog>
  <dialog id="transferDialog">
    <form id="transferForm">
      <div class="modal-head"><h2>Traspasar billetera</h2><button type="button" class="btn small" id="closeTransfer">Cerrar</button></div>
      <div class="modal-body">
        <div class="notice">La cuenta conservará su identidad y sus datos. Solo cambiará de celular. Podés elegir un celular de cualquier casino.</div>
        <div id="transferSummary" class="muted"></div>
        <div class="form-field"><label>Casino de destino</label><select class="field" id="destCasino" required></select></div>
        <div class="form-field"><label>Celular de destino</label><select class="field" id="destPhone" required></select></div>
        <div class="form-field"><label>Observación (opcional)</label><textarea class="field" id="transferNotes" placeholder="Motivo del traspaso..."></textarea></div>
        <div id="transferError" class="error"></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" id="cancelTransfer">Cancelar</button><button type="submit" class="btn primary">Confirmar traspaso</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast hidden"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // PEGÁ AQUÍ los datos de Supabase > Project Settings > API Keys.
    const SUPABASE_URL = 'https://bkxtojlepodljmwwwhub.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_apcpZvxNUPNCVPUR0zaeeA_E5dDPsRq';

    const $ = (s, root=document) => root.querySelector(s);
    let sb, casinos=[], phones=[], wallets=[], transfers=[];
    let page='dashboard', selectedCasino=null, selectedPhone=null, selectedWallet=null;
    let editing={type:null,id:null};
    const appView=$('#appView'), content=$('#content');

    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}
    function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function statusPill(s){const map={active:['Activo','green'],inactive:['Inactivo','amber'],blocked:['Bloqueado','red'],archived:['Archivado','amber']};const x=map[s]||[s,''];return `<span class="pill ${x[1]}">${x[0]}</span>`}
    function casinoName(id){return casinos.find(x=>x.id===id)?.name||'Casino no disponible'}
    function phoneName(id){const p=phones.find(x=>x.id===id);return p?`${p.label} · ${casinoName(p.casino_id)}`:'Celular no disponible'}
    function countWallets(phoneId){return wallets.filter(w=>w.celular_id===phoneId&&w.status!=='archived').length}
    function setCrumb(v){$('#breadcrumb').textContent=v}
    function setPageNav(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
    async function loadData(){
      const [c,p,w,t]=await Promise.all([
        sb.from('casinos').select('*').neq('status','archived').order('name'),
        sb.from('celulares').select('*').neq('status','archived').order('label'),
        sb.from('billeteras').select('*').neq('status','archived').order('provider'),
        sb.from('traspasos').select('*').order('created_at',{ascending:false}).limit(100)
      ]);
      for(const r of [c,p,w,t])if(r.error)throw r.error;
      casinos=c.data||[];phones=p.data||[];wallets=w.data||[];transfers=t.data||[];
    }
    async function refresh(){await loadData();render()}
    function showApp(){appView.classList.remove('hidden')}
    function empty(title,desc,button=''){return `<div class="empty"><strong>${title}</strong>${desc}${button?`<div style="margin-top:15px">${button}</div>`:''}</div>`}
    function actionBtn(label,action,id,cls=''){return `<button class="btn small ${cls}" data-action="${action}" data-id="${id}">${label}</button>`}
    function render(){
      setPageNav();
      if(page==='dashboard')return renderDashboard();
      if(page==='casinos')return renderCasinos();
      if(page==='casino')return renderCasino();
      if(page==='phone')return renderPhone();
      if(page==='wallet')return renderWallet();
    }
    function renderDashboard(){
      setCrumb('Inicio / Panel principal');
      const activePhones=phones.filter(p=>p.status!=='archived');
      const activeWallets=wallets.filter(w=>w.status!=='archived');
      content.innerHTML=`<h1 class="page-title">Panel principal</h1><p class="sub">Resumen general de celulares y cuentas registradas.</p>
        <div class="stats">
          <div class="stat"><span>Celulares registrados</span><strong>${activePhones.length}</strong></div>
          <div class="stat"><span>Cuentas registradas</span><strong>${activeWallets.length}</strong></div>
          <div class="stat"><span>Casinos</span><strong>${casinos.filter(c=>c.status!=='archived').length}</strong></div>
        </div>
        <div class="section-head"><h2>Celulares</h2>${casinos.some(c=>c.status==='active')?'<button class="btn primary" data-action="new-phone">＋ Agregar celular</button>':''}</div>
        ${activePhones.length?`<div class="grid">${activePhones.map(p=>{
          const c=casinos.find(x=>x.id===p.casino_id);
          const count=activeWallets.filter(w=>w.celular_id===p.id).length;
          return `<article class="card clickable" data-action="open-phone" data-id="${p.id}">
            <div class="card-top"><div><h3>▯ ${esc(p.label||'Celular sin nombre')}</h3>
            <div class="meta">${esc(p.phone_number||'Sin número registrado')}</div></div>${statusPill(p.status)}</div>
            <div class="meta">${esc(c?.name||'Casino no disponible')} · ${count} cuentas</div>
            <div class="card-actions"><button class="btn small" data-action="open-phone" data-id="${p.id}">Ver cuentas →</button>${actionBtn('Editar','edit-phone',p.id)}</div>
          </article>`;
        }).join('')}</div>`:casinos.some(c=>c.status==='active')?empty('Todavía no hay celulares','Agregá el primer celular para comenzar.',actionBtn('＋ Agregar celular','new-phone','')):empty('Todavía no hay celulares','Primero necesitás tener al menos un casino activo para poder agregar celulares.',actionBtn('Ir a casinos','go-casinos',''))}`;
    }
    function renderCasinos(){
      setCrumb('Inicio / Casinos');
      content.innerHTML=`<div class="section-head" style="margin-top:0"><div><h1 class="page-title">Casinos</h1><p class="sub" style="margin:5px 0 0">Administrá los casinos y sus celulares.</p></div><button class="btn primary" data-action="new-casino">＋ Agregar casino</button></div>
      <div class="toolbar"><input id="searchInput" class="field search" placeholder="Buscar casino..."></div><div id="casinoGrid" class="grid"></div>`;
      paintCasinoGrid();
      $('#searchInput').addEventListener('input',paintCasinoGrid);
    }
    function paintCasinoGrid(){
      const q=($('#searchInput')?.value||'').toLowerCase();
      const list=casinos.filter(c=>c.name.toLowerCase().includes(q));
      $('#casinoGrid').innerHTML=list.length?list.map(c=>`<article class="card clickable" data-action="open-casino" data-id="${c.id}"><div class="card-top"><div><h3>${esc(c.name)}</h3><div class="meta">${phones.filter(p=>p.casino_id===c.id).length} celulares · ${wallets.filter(w=>phones.some(p=>p.id===w.celular_id&&p.casino_id===c.id)).length} billeteras</div></div>${statusPill(c.status)}</div><div class="card-actions">${actionBtn('Abrir','open-casino',c.id)}${actionBtn('Editar','edit-casino',c.id)}</div></article>`).join(''):empty('No hay resultados','Probá con otro nombre o agregá un casino.');
    }
    function renderCasino(){
      const c=casinos.find(x=>x.id===selectedCasino);if(!c){page='casinos';return render()}
      setCrumb(`Casinos / ${c.name}`);
      const list=phones.filter(p=>p.casino_id===c.id);
      content.innerHTML=`<button class="back" data-action="back-casinos">← Volver a casinos</button><div class="detail-head"><div class="detail-title"><div class="detail-icon">▣</div><div><h1 class="page-title">${esc(c.name)}</h1><div class="muted">Detalle del casino</div></div></div><div class="top-actions">${actionBtn('Editar casino','edit-casino',c.id)}<button class="btn primary" data-action="new-phone">＋ Agregar celular</button></div></div>
      <div class="info-grid"><div class="info-box"><small>Celulares</small><b>${list.length}</b></div><div class="info-box"><small>Billeteras</small><b>${wallets.filter(w=>list.some(p=>p.id===w.celular_id)).length}</b></div><div class="info-box"><small>Estado</small>${statusPill(c.status)}</div></div>
      <div class="section-head"><h2>Celulares de ${esc(c.name)}</h2></div>
      ${list.length?`<div class="grid">${list.map(p=>`<article class="card clickable" data-action="open-phone" data-id="${p.id}"><div class="card-top"><div><h3>▯ ${esc(p.label)}</h3><div class="meta">${esc(p.phone_number||'Sin número registrado')}</div></div>${statusPill(p.status)}</div><div class="meta">${esc([p.brand,p.model].filter(Boolean).join(' '))}</div><div class="card-actions">${actionBtn('Ver billeteras','open-phone',p.id)}${actionBtn('Editar','edit-phone',p.id)}</div></article>`).join('')}</div>`:empty('Este casino todavía no tiene celulares','Agregá un celular para cargar sus billeteras.',actionBtn('＋ Agregar celular','new-phone',''))}`;
    }
    function renderPhone(){
      const p=phones.find(x=>x.id===selectedPhone);if(!p){page='casino';return render()}
      setCrumb(`Casinos / ${casinoName(p.casino_id)} / ${p.label}`);
      const list=wallets.filter(w=>w.celular_id===p.id);
      content.innerHTML=`<button class="back" data-action="back-casino">← Volver a ${esc(casinoName(p.casino_id))}</button><div class="detail-head"><div class="detail-title"><div class="detail-icon">▯</div><div><h1 class="page-title">${esc(p.label)}</h1><div class="muted">${esc(casinoName(p.casino_id))} · ${esc(p.phone_number||'Sin número')}</div></div></div><div class="top-actions">${actionBtn('Editar celular','edit-phone',p.id)}<button class="btn primary" data-action="new-wallet">＋ Agregar billetera</button></div></div>
      <div class="info-grid"><div class="info-box"><small>Número telefónico</small><b>${esc(p.phone_number||'—')}</b></div><div class="info-box"><small>Marca / modelo</small><b>${esc([p.brand,p.model].filter(Boolean).join(' ')||'—')}</b></div><div class="info-box"><small>Billeteras</small><b>${list.length}</b></div></div>
      <div class="section-head"><h2>Billeteras registradas</h2></div>
      ${list.length?`<div class="table-wrap"><table><thead><tr><th>Plataforma</th><th>Identificación</th><th>Titular</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map(w=>`<tr><td><b>${esc(w.provider)}</b><div class="meta">${esc(w.account_label)}</div></td><td>${esc(w.account_identifier)}</td><td>${esc(w.holder||'—')}</td><td>${statusPill(w.status)}</td><td><div class="top-actions">${actionBtn('Abrir','open-wallet',w.id)}${actionBtn('Traspasar','transfer-wallet',w.id)}</div></td></tr>`).join('')}</tbody></table></div>`:empty('No hay billeteras cargadas','Agregá la primera billetera de este celular.',actionBtn('＋ Agregar billetera','new-wallet',''))}`;
    }
    function renderWallet(){
      const w=wallets.find(x=>x.id===selectedWallet);if(!w){page='phone';return render()}
      const p=phones.find(x=>x.id===w.celular_id);
      setCrumb(`Casinos / ${casinoName(p?.casino_id)} / ${p?.label||'Celular'} / ${w.provider}`);
      const extra=Object.entries(w.extra_info||{});
      const history=transfers.filter(t=>t.billetera_id===w.id);
      content.innerHTML=`<button class="back" data-action="back-phone">← Volver a ${esc(p?.label||'celular')}</button><div class="detail-head"><div class="detail-title"><div class="detail-icon">◇</div><div><h1 class="page-title">${esc(w.provider)}</h1><div class="muted">${esc(w.account_label||w.account_identifier)}</div></div></div><div class="top-actions">${actionBtn('Editar información','edit-wallet',w.id)}${actionBtn('Traspasar a otro celular','transfer-wallet',w.id)}</div></div>
      <div class="info-grid"><div class="info-box"><small>Identificador de cuenta</small><b>${esc(w.account_identifier)}</b></div><div class="info-box"><small>Titular</small><b>${esc(w.holder||'—')}</b></div><div class="info-box"><small>Correo</small><b>${esc(w.email||'—')}</b></div><div class="info-box"><small>Teléfono asociado</small><b>${esc(w.phone_associated||'—')}</b></div><div class="info-box"><small>Ubicación actual</small><b>${esc(phoneName(w.celular_id))}</b></div><div class="info-box"><small>Estado</small>${statusPill(w.status)}</div></div>
      ${w.notes?`<div class="card"><b>Observaciones</b><p class="muted">${esc(w.notes)}</p></div>`:''}
      ${extra.length?`<div class="section-head"><h2>Información adicional</h2></div><div class="info-grid">${extra.map(([k,v])=>`<div class="info-box"><small>${esc(k)}</small><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')}</div>`:''}
      <div class="section-head"><h2>Historial de traspasos</h2></div>
      ${history.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Origen</th><th>Destino</th><th>Observación</th></tr></thead><tbody>${history.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString('es-AR')}</td><td>${esc(phoneName(t.celular_origen_id))}</td><td>${esc(phoneName(t.celular_destino_id))}</td><td>${esc(t.notes||'—')}</td></tr>`).join('')}</tbody></table></div>`:empty('Sin traspasos registrados','Esta cuenta todavía no fue trasladada.')}`;
    }

    function field(name,label,value='',type='text',required=false,placeholder=''){return `<div class="form-field"><label>${label}</label><input class="field" name="${name}" type="${type}" value="${esc(value??'')}" ${required?'required':''} placeholder="${esc(placeholder)}"></div>`}
    function selectField(name,label,options,value,required=true){return `<div class="form-field"><label>${label}</label><select class="field" name="${name}" ${required?'required':''}>${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`}
    function textareaField(name,label,value=''){return `<div class="form-field"><label>${label}</label><textarea class="field" name="${name}">${esc(value||'')}</textarea></div>`}
    function openForm(type,id=null){
      editing={type,id};const old=id?({casino:casinos,phone:phones,wallet:wallets}[type]).find(x=>x.id===id):null;
      let title='',fields='';
      if(type==='casino'){
        title=id?'Editar casino':'Nuevo casino';
        fields=field('name','Nombre del casino',old?.name||'', 'text',true)+textareaField('notes','Observaciones',old?.notes)+selectField('status','Estado',[{value:'active',label:'Activo'},{value:'inactive',label:'Inactivo'}],old?.status||'active');
      }else if(type==='phone'){
        title=id?'Editar celular':'Nuevo celular';
        const casinoId=old?.casino_id||selectedCasino;
        fields=selectField('casino_id','Casino',casinos.filter(c=>c.status==='active').map(c=>({value:c.id,label:c.name})),casinoId)+field('label','Nombre identificador (ej. Celular azul)',old?.label||'', 'text',true)+field('phone_number','Número telefónico',old?.phone_number||'')+`<div class="form-row">${field('brand','Marca',old?.brand||'')}${field('model','Modelo',old?.model||'')}</div>`+selectField('status','Estado',[{value:'active',label:'Activo'},{value:'inactive',label:'Inactivo'}],old?.status||'active')+textareaField('notes','Observaciones',old?.notes);
      }else{
        title=id?'Editar billetera':'Nueva billetera';
        fields=selectField('celular_id','Celular',phones.filter(p=>p.status==='active').map(p=>({value:p.id,label:`${p.label} — ${casinoName(p.casino_id)}`})),old?.celular_id||selectedPhone)+field('provider','Billetera / plataforma',old?.provider||'', 'text',true)+field('account_label','Nombre de referencia',old?.account_label||'')+field('account_identifier','Identificador único de la cuenta (usuario, alias o ID)',old?.account_identifier||'', 'text',true)+field('holder','Titular',old?.holder||'')+field('email','Correo asociado',old?.email||'','email')+field('phone_associated','Teléfono asociado',old?.phone_associated||'')+selectField('status','Estado',[{value:'active',label:'Activa'},{value:'inactive',label:'Inactiva'},{value:'blocked',label:'Bloqueada'}],old?.status||'active')+textareaField('extra_info_text','Información adicional (una propiedad por línea: Clave: valor)',old?.extra_info?Object.entries(old.extra_info).map(([k,v])=>`${k}: ${v}`).join('\n'):'')+textareaField('notes','Observaciones',old?.notes)+`<div class="help">No ingreses contraseñas, PIN, códigos de autenticación ni claves de recuperación.</div>`;
      }
      $('#dialogTitle').textContent=title;$('#dialogFields').innerHTML=fields+'<div id="formError" class="error" role="alert"></div>';$('#editDialog').showModal();
    }
    function parseExtra(text){
      const obj={};(text||'').split('\n').forEach(line=>{const i=line.indexOf(':');if(i>0){const k=line.slice(0,i).trim(),v=line.slice(i+1).trim();if(k)obj[k]=v}});return obj;
    }
    async function saveForm(e){
      e.preventDefault();
      const form=e.currentTarget, submit=form.querySelector('button[type=submit]');
      const fd=new FormData(form),v=Object.fromEntries(fd.entries()),{type,id}=editing;
      const errorBox=$('#formError'); if(errorBox)errorBox.textContent='';
      if(submit){submit.disabled=true;submit.textContent='Guardando…'}
      try{
        let res;
        if(type==='casino'){
          const data={name:(v.name||'').trim(),notes:v.notes||'',status:v.status||'active'};
          if(!data.name)throw new Error('Escribí el nombre del casino.');
          res=id?await sb.from('casinos').update(data).eq('id',id):await sb.from('casinos').insert(data);
        }else if(type==='phone'){
          const data={casino_id:v.casino_id,label:(v.label||'').trim(),phone_number:v.phone_number||'',brand:v.brand||'',model:v.model||'',status:v.status||'active',notes:v.notes||''};
          if(!data.casino_id)throw new Error('Elegí un casino.'); if(!data.label)throw new Error('Escribí el nombre del celular.');
          res=id?await sb.from('celulares').update(data).eq('id',id):await sb.from('celulares').insert(data);
        }else if(type==='wallet'){
          const data={celular_id:v.celular_id,provider:(v.provider||'').trim(),account_label:v.account_label||'',account_identifier:(v.account_identifier||'').trim(),holder:v.holder||'',email:v.email||'',phone_associated:v.phone_associated||'',status:v.status||'active',extra_info:parseExtra(v.extra_info_text),notes:v.notes||''};
          if(!data.celular_id)throw new Error('Elegí un celular.'); if(!data.provider||!data.account_identifier)throw new Error('Completá la plataforma y el identificador de la cuenta.');
          res=id?await sb.from('billeteras').update(data).eq('id',id):await sb.from('billeteras').insert(data);
        }else throw new Error('No se reconoció el tipo de registro.');
        if(res?.error)throw res.error;
        $('#editDialog').close();toast('Información guardada correctamente.');await refresh();
      }catch(err){
        const message=err?.message||'No se pudo guardar. Revisá la conexión y los permisos de Supabase.';
        if(errorBox)errorBox.textContent=message;toast(message);
      }finally{if(submit){submit.disabled=false;submit.textContent='Guardar'}}
    }
    async function startTransfer(walletId){
      const w=wallets.find(x=>x.id===walletId);if(!w)return;
      $('#transferSummary').innerHTML=`<b>${esc(w.provider)}</b> · ${esc(w.account_identifier)}<br><span class="muted">Ubicación actual: ${esc(phoneName(w.celular_id))}</span>`;
      const activePhones=phones.filter(p=>p.status==='active'&&p.id!==w.celular_id);
      const casinoIds=[...new Set(activePhones.map(p=>p.casino_id))];
      $('#destCasino').innerHTML=casinos.filter(c=>casinoIds.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
      updateDestPhones();
      $('#transferError').textContent='';$('#transferDialog').dataset.walletId=walletId;$('#transferDialog').showModal();
    }
    function updateDestPhones(){
      const casinoId=$('#destCasino').value;
      const list=phones.filter(p=>p.casino_id===casinoId&&p.status==='active'&&p.id!==wallets.find(w=>w.id===$('#transferDialog').dataset.walletId)?.celular_id);
      $('#destPhone').innerHTML=list.map(p=>`<option value="${p.id}">${esc(p.label)} — ${esc(p.phone_number||'sin número')}</option>`).join('');
      $('#destPhone').disabled=!list.length;
    }
    async function doTransfer(e){
      e.preventDefault();const id=$('#transferDialog').dataset.walletId,to=$('#destPhone').value,notes=$('#transferNotes').value;
      try{const {error}=await sb.rpc('traspasar_billetera',{p_billetera_id:id,p_celular_destino_id:to,p_notes:notes});if(error)throw error;
        $('#transferDialog').close();toast('Traspaso realizado. La cuenta conserva su historial.');await refresh();page='wallet';selectedWallet=id;render();
      }catch(err){$('#transferError').textContent=err.message||'No se pudo realizar el traspaso.'}
    }
    async function archive(type,id){
      if(!confirm('¿Querés archivar este registro? No se borrará físicamente y dejará de aparecer en los listados habituales.'))return;
      const table={casino:'casinos',phone:'celulares',wallet:'billeteras'}[type];
      const {error}=await sb.from(table).update({status:'archived'}).eq('id',id);
      if(error){toast(error.message);return}
      toast('Registro archivado.');await refresh();
    }
    document.addEventListener('click',async e=>{
      const b=e.target.closest('[data-action]');if(!b)return;
      const {action,id}=b.dataset;
      try{
        if(action==='new-casino')openForm('casino');
        if(action==='new-phone'){if(!casinos.some(c=>c.status==='active'))return toast('Primero creá un casino.');openForm('phone')}
        if(action==='go-casinos'){page='casinos';render()}
        if(action==='new-wallet'){if(!phones.some(p=>p.status==='active'))return toast('Primero creá un celular activo.');openForm('wallet')}
        if(action==='edit-casino')openForm('casino',id);
        if(action==='edit-phone')openForm('phone',id);
        if(action==='edit-wallet')openForm('wallet',id);
        if(action==='open-casino'){selectedCasino=id;page='casino';render()}
        if(action==='open-phone'){selectedPhone=id;page='phone';render()}
        if(action==='open-wallet'){selectedWallet=id;page='wallet';render()}
        if(action==='transfer-wallet')await startTransfer(id);
        if(action==='back-casinos'){page='casinos';render()}
        if(action==='back-casino'){page='casino';render()}
        if(action==='back-phone'){page='phone';render()}
        if(action==='archive-casino')await archive('casino',id);
        if(action==='archive-phone')await archive('phone',id);
        if(action==='archive-wallet')await archive('wallet',id);
      }catch(err){toast(err.message||'Ocurrió un error.')}
    });
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
    $('#editForm').addEventListener('submit',saveForm);
    $('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#editDialog').close();
    $('#closeTransfer').onclick=$('#cancelTransfer').onclick=()=>$('#transferDialog').close();
    $('#destCasino').addEventListener('change',updateDestPhones);
    $('#transferForm').addEventListener('submit',doTransfer);
    if(SUPABASE_URL.startsWith('https://')&&SUPABASE_ANON_KEY.startsWith('sb_publishable_')){
      sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      showApp();try{await refresh()}catch(e){content.innerHTML=`<div class="empty"><strong>No se pudieron cargar los datos</strong>${esc(e.message)}<div style="margin-top:12px"><button class="btn primary" onclick="location.reload()">Reintentar</button></div></div>`}
    }else{
      appView.classList.remove('hidden');
      content.innerHTML='<div class="empty"><strong>Falta configurar Supabase</strong>Revisá la URL y la publishable key dentro de index.html.</div>';
    }

  </script>
</body>
</html>
